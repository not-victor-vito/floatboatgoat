<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Float Boat Goat Scorer</title>
<style>
  :root {
    --bg: #12161c;
    --card: #1c222c;
    --card-2: #232b37;
    --line: #333d4d;
    --text: #f2f5f9;
    --muted: #9aa7ba;
    --p1: #ffb020;
    --p2: #35c4f0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  body { padding: 0 12px calc(18px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 620px; margin: 0 auto; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, var(--bg) 78%, rgba(18,22,28,0));
    padding: calc(8px + env(safe-area-inset-top)) 0 10px;
  }
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .pcard {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 8px 10px 9px;
    text-align: center;
  }
  .pcard.p1 { border-color: var(--p1); }
  .pcard.p2 { border-color: var(--p2); }
  .pname {
    width: 100%;
    background: transparent;
    border: 0;
    color: var(--text);
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    padding: 2px 0;
    border-bottom: 1px dashed var(--line);
    outline: none;
  }
  .pname:focus { border-bottom-color: var(--text); }
  .ptotal { font-size: 32px; font-weight: 800; line-height: 1.1; margin-top: 2px; }
  .pcard.p1 .ptotal { color: var(--p1); }
  .pcard.p2 .ptotal { color: var(--p2); }
  .plabel { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

  .game {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 9px 10px 11px;
    margin-bottom: 9px;
    overflow: hidden;
  }
  .ghead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
  }
  .gtitle { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .gwins { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .gwins .w1 { color: var(--p1); }
  .gwins .w2 { color: var(--p2); }
  .gwins .sep { color: var(--muted); margin: 0 4px; }

  .prow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .ptag {
    width: 34px;
    flex: 0 0 34px;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    padding: 4px 0;
    border-radius: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ptag.t1 { background: rgba(255,176,32,.16); color: var(--p1); }
  .ptag.t2 { background: rgba(53,196,240,.16); color: var(--p2); }
  .chips { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 1 1 auto; }
  .chip {
    appearance: none;
    border: 2px solid var(--line);
    background: var(--card-2);
    color: var(--muted);
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    padding: 11px 4px;
    border-radius: 14px;
    text-transform: lowercase;
    cursor: pointer;
    transition: transform .06s ease;
    user-select: none;
  }
  .chip:active { transform: scale(.96); }
  .chip.on.c1 { background: var(--p1); border-color: var(--p1); color: #1a1300; }
  .chip.on.c2 { background: var(--p2); border-color: var(--p2); color: #001721; }

  .winbar {
    position: absolute;
    inset: 0;
    background: rgba(18,22,28,.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
    text-align: center;
  }
  .wintext { font-size: 20px; font-weight: 800; }
  .winsub { font-size: 13px; color: var(--muted); margin-top: -6px; }
  .winbtn {
    appearance: none;
    border: 0;
    border-radius: 14px;
    padding: 16px 30px;
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    cursor: pointer;
    color: #101418;
  }
  .winbtn.b1 { background: var(--p1); }
  .winbtn.b2 { background: var(--p2); }

  .footer { margin-top: 12px; text-align: center; }
  .reset {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 12px;
    cursor: pointer;
  }
  .reset.arm { border-color: #ff6b6b; color: #ff6b6b; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="scoreboard">
      <div class="pcard p1">
        <input class="pname" id="name0" value="Player 1" maxlength="12" aria-label="Player 1 name">
        <div class="ptotal" id="total0">0</div>
        <div class="plabel">rounds won</div>
      </div>
      <div class="pcard p2">
        <input class="pname" id="name1" value="Player 2" maxlength="12" aria-label="Player 2 name">
        <div class="ptotal" id="total1">0</div>
        <div class="plabel">rounds won</div>
      </div>
    </div>
  </header>

  <main id="games"></main>

  <div class="footer">
    <button class="reset" id="reset">Reset everything</button>
    <p class="hint">Tap a word to claim it, tap again to un-claim. Claim all three and the round is yours.</p>
  </div>

</div>

<script>
(function () {
  var GAMES = [
    { id: 'g1', words: ['float', 'boat', 'goat'] },
    { id: 'g2', words: ['rode', 'toed', 'hoed'] },
    { id: 'g3', words: ['block', 'cock', 'stock'] },
    { id: 'g4', words: ['steed', 'feed', 'mead'] },
    { id: 'g5', words: ['flag', 'wag', 'stag'] }
  ];

  var names = ['Player 1', 'Player 2'];
  var totals = [0, 0];
  var state = [];

  function blankGame() {
    return {
      claims: [[false, false, false], [false, false, false]],
      wins: [0, 0],
      pending: null
    };
  }

  function initState() {
    state = GAMES.map(blankGame);
    totals = [0, 0];
  }

  var gamesEl = document.getElementById('games');

  function build() {
    gamesEl.innerHTML = '';
    GAMES.forEach(function (game, gi) {
      var card = document.createElement('section');
      card.className = 'game';
      card.id = 'card-' + gi;

      var head = document.createElement('div');
      head.className = 'ghead';
      var title = document.createElement('div');
      title.className = 'gtitle';
      title.textContent = game.words.join(' / ');
      var wins = document.createElement('div');
      wins.className = 'gwins';
      wins.id = 'wins-' + gi;
      head.appendChild(title);
      head.appendChild(wins);
      card.appendChild(head);

      [0, 1].forEach(function (pi) {
        var row = document.createElement('div');
        row.className = 'prow';
        var tag = document.createElement('div');
        tag.className = 'ptag t' + (pi + 1);
        tag.id = 'tag-' + gi + '-' + pi;
        row.appendChild(tag);

        var chips = document.createElement('div');
        chips.className = 'chips';
        game.words.forEach(function (word, wi) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'chip c' + (pi + 1);
          b.id = 'chip-' + gi + '-' + pi + '-' + wi;
          b.textContent = word;
          b.addEventListener('click', function () { toggle(gi, pi, wi); });
          chips.appendChild(b);
        });
        row.appendChild(chips);
        card.appendChild(row);
      });

      gamesEl.appendChild(card);
    });
  }

  function toggle(gi, pi, wi) {
    var g = state[gi];
    if (g.pending !== null) return;
    g.claims[pi][wi] = !g.claims[pi][wi];
    if (g.claims[pi].every(Boolean)) {
      g.pending = pi;
    }
    render();
  }

  function confirmWin(gi) {
    var g = state[gi];
    if (g.pending === null) return;
    var pi = g.pending;
    g.wins[pi] += 1;
    totals[pi] += 1;
    g.claims = [[false, false, false], [false, false, false]];
    g.pending = null;
    render();
  }

  function shortName(pi) {
    var n = (names[pi] || '').trim();
    return n ? n.slice(0, 3).toUpperCase() : (pi === 0 ? 'P1' : 'P2');
  }

  function fullName(pi) {
    var n = (names[pi] || '').trim();
    return n ? n : 'Player ' + (pi + 1);
  }

  function render() {
    document.getElementById('total0').textContent = totals[0];
    document.getElementById('total1').textContent = totals[1];

    state.forEach(function (g, gi) {
      document.getElementById('wins-' + gi).innerHTML =
        '<span class="w1">' + g.wins[0] + '</span><span class="sep">-</span><span class="w2">' + g.wins[1] + '</span>';

      [0, 1].forEach(function (pi) {
        document.getElementById('tag-' + gi + '-' + pi).textContent = shortName(pi);
        GAMES[gi].words.forEach(function (w, wi) {
          var el = document.getElementById('chip-' + gi + '-' + pi + '-' + wi);
          if (g.claims[pi][wi]) { el.classList.add('on'); } else { el.classList.remove('on'); }
          el.setAttribute('aria-pressed', g.claims[pi][wi] ? 'true' : 'false');
        });
      });

      var card = document.getElementById('card-' + gi);
      var existing = card.querySelector('.winbar');
      if (existing) card.removeChild(existing);

      if (g.pending !== null) {
        var pi2 = g.pending;
        var bar = document.createElement('div');
        bar.className = 'winbar';
        var t = document.createElement('div');
        t.className = 'wintext';
        t.textContent = fullName(pi2) + ' wins the round';
        var s = document.createElement('div');
        s.className = 'winsub';
        s.textContent = GAMES[gi].words.join(' / ');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'winbtn b' + (pi2 + 1);
        b.textContent = 'Score it';
        b.addEventListener('click', function () { confirmWin(gi); });
        bar.appendChild(t);
        bar.appendChild(s);
        bar.appendChild(b);
        card.appendChild(bar);
      }
    });
  }

  [0, 1].forEach(function (pi) {
    var input = document.getElementById('name' + pi);
    input.addEventListener('input', function () {
      names[pi] = input.value;
      render();
    });
    input.addEventListener('blur', function () {
      if (!input.value.trim()) {
        input.value = 'Player ' + (pi + 1);
        names[pi] = input.value;
        render();
      }
    });
  });

  var resetBtn = document.getElementById('reset');
  var armed = false;
  var armTimer = null;
  resetBtn.addEventListener('click', function () {
    if (!armed) {
      armed = true;
      resetBtn.classList.add('arm');
      resetBtn.textContent = 'Tap again to wipe all scores';
      armTimer = setTimeout(function () {
        armed = false;
        resetBtn.classList.remove('arm');
        resetBtn.textContent = 'Reset everything';
      }, 4000);
      return;
    }
    clearTimeout(armTimer);
    armed = false;
    resetBtn.classList.remove('arm');
    resetBtn.textContent = 'Reset everything';
    initState();
    render();
  });

  initState();
  build();
  render();
})();
</script>
</body>
</html>
