<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf3dc">
<title>Goat Watch</title>
<style>
  :root {
    --bg: #fdf3dc;
    --paper: #fffdf5;
    --ink: #453522;
    --muted: #9a8768;
    --line: #d8c4a0;
    --gav: #e8562a;
    --gin: #1f9e8f;
    --shadow: rgba(69, 53, 34, .22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(232,86,42,.06) 0 22px, transparent 23px),
      radial-gradient(circle at 88% 62%, rgba(31,158,143,.06) 0 26px, transparent 27px),
      radial-gradient(circle at 40% 88%, rgba(232,180,42,.07) 0 20px, transparent 21px);
    color: var(--ink);
    font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "Segoe Print", "Bradley Hand", cursive;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  body { padding: 0 12px calc(20px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 620px; margin: 0 auto; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, var(--bg) 80%, rgba(253,243,220,0));
    padding: calc(6px + env(safe-area-inset-top)) 0 10px;
  }
  .banner {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pcard {
    position: relative;
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 20px;
    padding: 6px 8px 8px;
    text-align: center;
    box-shadow: 3px 4px 0 var(--shadow);
  }
  .pcard.p1 { border-color: var(--gav); transform: rotate(-1.1deg); }
  .pcard.p2 { border-color: var(--gin); transform: rotate(1.1deg); }
  .pmug { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .pmug svg { width: 30px; height: 30px; flex: 0 0 30px; }
  .pname { font-weight: 800; font-size: 20px; letter-spacing: .05em; }
  .pcard.p1 .pname { color: var(--gav); }
  .pcard.p2 .pname { color: var(--gin); }
  .ptotal { font-size: 36px; font-weight: 800; line-height: 1; margin-top: 2px; }
  .plabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .game {
    position: relative;
    background: var(--paper);
    border: 3px dashed var(--line);
    border-radius: 22px;
    padding: 8px 10px 11px;
    margin-bottom: 11px;
    overflow: hidden;
    box-shadow: 3px 4px 0 var(--shadow);
  }
  .game:nth-child(odd) { transform: rotate(-.35deg); }
  .game:nth-child(even) { transform: rotate(.35deg); }
  .ghost {
    position: absolute;
    right: -14px;
    bottom: -18px;
    width: 92px;
    height: 92px;
    opacity: .07;
    pointer-events: none;
  }
  .ghead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .gtitle { font-size: 14px; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
  .gwins { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .gwins .w1 { color: var(--gav); }
  .gwins .w2 { color: var(--gin); }
  .gwins .sep { color: var(--muted); margin: 0 3px; }

  .prow { display: flex; align-items: center; gap: 8px; margin-top: 6px; position: relative; z-index: 1; }
  .ptag {
    width: 40px;
    flex: 0 0 40px;
    font-size: 13px;
    font-weight: 800;
    text-align: center;
    padding: 5px 0;
    border-radius: 10px;
    letter-spacing: .04em;
  }
  .ptag.t1 { background: rgba(232,86,42,.14); color: var(--gav); transform: rotate(-2deg); }
  .ptag.t2 { background: rgba(31,158,143,.14); color: var(--gin); transform: rotate(2deg); }
  .chips { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 1 1 auto; }
  .chip {
    appearance: none;
    border: 3px solid var(--line);
    background: #fffaee;
    color: var(--muted);
    font: inherit;
    font-weight: 800;
    font-size: 17px;
    padding: 11px 4px;
    border-radius: 16px;
    text-transform: lowercase;
    cursor: pointer;
    transition: transform .08s ease;
    user-select: none;
  }
  .chip:active { transform: scale(.94) rotate(-2deg); }
  .chip.on { color: #fffdf5; animation: pop .3s ease; }
  .chip.on.c1 { background: var(--gav); border-color: #b93c17; transform: rotate(-2deg); }
  .chip.on.c2 { background: var(--gin); border-color: #14776b; transform: rotate(2deg); }
  @keyframes pop {
    0% { transform: scale(.8) rotate(0deg); }
    55% { transform: scale(1.12) rotate(3deg); }
    100% { transform: scale(1) rotate(-2deg); }
  }

  .winbar {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: rgba(255, 250, 233, .97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    text-align: center;
  }
  .winbar svg { width: 44px; height: 44px; flex: 0 0 44px; animation: bounce .8s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-7px) rotate(4deg); }
  }
  .wintext { font-size: 21px; font-weight: 800; }
  .winsub { font-size: 13px; color: var(--muted); }
  .winbtn {
    appearance: none;
    border: 3px solid rgba(69,53,34,.25);
    border-radius: 16px;
    padding: 12px 28px;
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    cursor: pointer;
    color: #fffdf5;
    box-shadow: 2px 3px 0 var(--shadow);
  }
  .winbtn.b1 { background: var(--gav); }
  .winbtn.b2 { background: var(--gin); }
  .winbtn:active { transform: translate(2px, 3px); box-shadow: none; }

  .footer { margin-top: 14px; text-align: center; }
  .reset {
    appearance: none;
    background: var(--paper);
    border: 3px dashed var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 16px;
    cursor: pointer;
  }
  .reset.arm { border-color: #d1462b; color: #d1462b; border-style: solid; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="goat" viewBox="0 0 100 108">
    <g fill="none" stroke="#5b4636" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M37 27 C 29 15, 19 8, 10 11 C 17 15, 24 24, 29 34" fill="#c8a04a"/>
      <path d="M63 27 C 71 15, 81 8, 90 11 C 83 15, 76 24, 71 34" fill="#c8a04a"/>
      <ellipse cx="21" cy="47" rx="14" ry="8" transform="rotate(-20 21 47)" fill="#efe0c4"/>
      <ellipse cx="79" cy="47" rx="14" ry="8" transform="rotate(20 79 47)" fill="#efe0c4"/>
      <path d="M50 22 C 68 22, 77 35, 75 50 C 73 63, 65 73, 58 78 C 54 81, 46 81, 42 78 C 35 73, 27 63, 25 50 C 23 35, 32 22, 50 22 Z" fill="#fbf3e4"/>
      <path d="M50 80 C 43 86, 44 97, 50 104 C 56 97, 57 86, 50 80 Z" fill="#fbf3e4"/>
      <ellipse cx="50" cy="69" rx="13" ry="9" fill="#fff9ef"/>
    </g>
    <ellipse cx="39" cy="49" rx="4.6" ry="5.6" fill="#3f2f22"/>
    <ellipse cx="61" cy="49" rx="4.6" ry="5.6" fill="#3f2f22"/>
    <circle cx="40.6" cy="47" r="1.7" fill="#fffdf5"/>
    <circle cx="62.6" cy="47" r="1.7" fill="#fffdf5"/>
    <ellipse cx="45" cy="66" rx="2.2" ry="1.6" fill="#7a5c45"/>
    <ellipse cx="55" cy="66" rx="2.2" ry="1.6" fill="#7a5c45"/>
    <path d="M44 72 C 47 75, 53 75, 56 72" fill="none" stroke="#7a5c45" stroke-width="3" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="wrap">

  <header class="top">
    <p class="banner">Goat Watch</p>
    <div class="scoreboard">
      <div class="pcard p1">
        <div class="pmug"><svg><use href="#goat"></use></svg><span class="pname" id="name0">GAV</span></div>
        <div class="ptotal" id="total0">0</div>
        <div class="plabel">rounds won</div>
      </div>
      <div class="pcard p2">
        <div class="pmug"><svg><use href="#goat"></use></svg><span class="pname" id="name1">GIN</span></div>
        <div class="ptotal" id="total1">0</div>
        <div class="plabel">rounds won</div>
      </div>
    </div>
  </header>

  <main id="games"></main>

  <div class="footer">
    <button class="reset" id="reset">Reset everything</button>
    <p class="hint">Tap a word to claim it, tap again to un-claim. Claim all three and the round is yours.</p>
  </div>

</div>

<script>
(function () {
  var GAMES = [
    { words: ['float', 'boat', 'goat'] },
    { words: ['rode', 'toed', 'hoed'] },
    { words: ['block', 'cock', 'stock'] },
    { words: ['steed', 'feed', 'mead'] },
    { words: ['flag', 'wag', 'stag'] }
  ];

  var NAMES = ['GAV', 'GIN'];

  var totals = [0, 0];
  var state = [];

  function blankGame() {
    return {
      claims: [[false, false, false], [false, false, false]],
      wins: [0, 0],
      pending: null
    };
  }

  function initState() {
    state = GAMES.map(blankGame);
    totals = [0, 0];
  }

  var gamesEl = document.getElementById('games');

  function goatSvg(cls) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    if (cls) s.setAttribute('class', cls);
    var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    u.setAttribute('href', '#goat');
    s.appendChild(u);
    return s;
  }

  function build() {
    gamesEl.innerHTML = '';
    GAMES.forEach(function (game, gi) {
      var card = document.createElement('section');
      card.className = 'game';
      card.id = 'card-' + gi;

      card.appendChild(goatSvg('ghost'));

      var head = document.createElement('div');
      head.className = 'ghead';
      var title = document.createElement('div');
      title.className = 'gtitle';
      title.textContent = game.words.join(' · ');
      var wins = document.createElement('div');
      wins.className = 'gwins';
      wins.id = 'wins-' + gi;
      head.appendChild(title);
      head.appendChild(wins);
      card.appendChild(head);

      [0, 1].forEach(function (pi) {
        var row = document.createElement('div');
        row.className = 'prow';
        var tag = document.createElement('div');
        tag.className = 'ptag t' + (pi + 1);
        tag.textContent = NAMES[pi];
        row.appendChild(tag);

        var chips = document.createElement('div');
        chips.className = 'chips';
        game.words.forEach(function (word, wi) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'chip c' + (pi + 1);
          b.id = 'chip-' + gi + '-' + pi + '-' + wi;
          b.textContent = word;
          b.addEventListener('click', function () { toggle(gi, pi, wi); });
          chips.appendChild(b);
        });
        row.appendChild(chips);
        card.appendChild(row);
      });

      gamesEl.appendChild(card);
    });
  }

  function toggle(gi, pi, wi) {
    var g = state[gi];
    if (g.pending !== null) return;
    g.claims[pi][wi] = !g.claims[pi][wi];
    if (g.claims[pi].every(Boolean)) g.pending = pi;
    render();
  }

  function confirmWin(gi) {
    var g = state[gi];
    if (g.pending === null) return;
    var pi = g.pending;
    g.wins[pi] += 1;
    totals[pi] += 1;
    g.claims = [[false, false, false], [false, false, false]];
    g.pending = null;
    render();
  }

  function render() {
    document.getElementById('total0').textContent = totals[0];
    document.getElementById('total1').textContent = totals[1];

    state.forEach(function (g, gi) {
      document.getElementById('wins-' + gi).innerHTML =
        '<span class="w1">' + g.wins[0] + '</span><span class="sep">-</span><span class="w2">' + g.wins[1] + '</span>';

      [0, 1].forEach(function (pi) {
        GAMES[gi].words.forEach(function (w, wi) {
          var el = document.getElementById('chip-' + gi + '-' + pi + '-' + wi);
          if (g.claims[pi][wi]) { el.classList.add('on'); } else { el.classList.remove('on'); }
          el.setAttribute('aria-pressed', g.claims[pi][wi] ? 'true' : 'false');
        });
      });

      var card = document.getElementById('card-' + gi);
      var existing = card.querySelector('.winbar');
      if (existing) card.removeChild(existing);

      if (g.pending !== null) {
        var pi2 = g.pending;
        var bar = document.createElement('div');
        bar.className = 'winbar';
        bar.appendChild(goatSvg(''));
        var t = document.createElement('div');
        t.className = 'wintext';
        t.textContent = NAMES[pi2] + ' wins the round!';
        var s = document.createElement('div');
        s.className = 'winsub';
        s.textContent = GAMES[gi].words.join(' · ');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'winbtn b' + (pi2 + 1);
        b.textContent = 'Score it';
        b.addEventListener('click', function () { confirmWin(gi); });
        bar.appendChild(t);
        bar.appendChild(s);
        bar.appendChild(b);
        card.appendChild(bar);
      }
    });
  }

  var resetBtn = document.getElementById('reset');
  var armed = false;
  var armTimer = null;
  resetBtn.addEventListener('click', function () {
    if (!armed) {
      armed = true;
      resetBtn.classList.add('arm');
      resetBtn.textContent = 'Tap again to wipe all scores';
      armTimer = setTimeout(function () {
        armed = false;
        resetBtn.classList.remove('arm');
        resetBtn.textContent = 'Reset everything';
      }, 4000);
      return;
    }
    clearTimeout(armTimer);
    armed = false;
    resetBtn.classList.remove('arm');
    resetBtn.textContent = 'Reset everything';
    initState();
    render();
  });

  initState();
  build();
  render();
})();
</script>
</body>
</html>
